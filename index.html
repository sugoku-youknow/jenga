<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#161a24">
<title>オンラインジェンガ</title>
<style>
  :root { --bg:#161a24; --panel:rgba(22,26,36,.92); --line:#2f3646; --text:#e8ebf2; --sub:#9aa3b5; --accent:#f0b25a; --accent2:#5aa9f0; --bad:#f06a5a; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif; overflow:hidden; overscroll-behavior:none; }
  #c { position:fixed; inset:0; width:100%; height:100%; touch-action:none; display:block; }
  #ui { position:fixed; inset:0; pointer-events:none; }
  #ui .p { pointer-events:auto; }
  .screen { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px 16px; background:rgba(16,19,27,.78); pointer-events:auto; overflow-y:auto; }
  .card { width:100%; max-width:380px; background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:20px 16px; }
  h1 { margin:0 0 4px; font-size:28px; letter-spacing:.06em; text-align:center; }
  .lead { margin:0 0 18px; text-align:center; color:var(--sub); font-size:13px; }
  label { display:block; font-size:12px; color:var(--sub); margin:12px 0 6px; }
  input { width:100%; font-size:18px; padding:12px; border-radius:10px; border:1px solid var(--line); background:#0f121a; color:var(--text); }
  button { font:inherit; font-size:17px; font-weight:700; border:0; border-radius:12px; padding:14px 12px; width:100%; margin-top:10px; background:#2a3142; color:var(--text); cursor:pointer; }
  button.main { background:var(--accent); color:#2a1a05; }
  button.blue { background:var(--accent2); color:#06192b; }
  button:disabled { opacity:.4; }
  .row { display:flex; gap:8px; }
  .row > * { flex:1; }
  .sep { margin:18px 0 4px; border-top:1px solid var(--line); }
  .code { font-size:48px; font-weight:800; letter-spacing:.2em; text-align:center; color:var(--accent); margin:4px 0; }
  .players { list-style:none; padding:0; margin:8px 0; }
  .players li { padding:10px 12px; border-radius:10px; background:#0f121a; margin-top:6px; display:flex; justify-content:space-between; }
  .err { color:var(--bad); font-size:14px; margin-top:10px; text-align:center; }
  .hud { position:absolute; left:0; right:0; top:0; padding:calc(env(safe-area-inset-top) + 10px) 12px 10px; display:flex; align-items:flex-start; gap:8px; background:linear-gradient(rgba(10,12,18,.85),rgba(10,12,18,0)); }
  .hud .who { flex:1; }
  .hud .turn { font-size:19px; font-weight:800; }
  .hud .turn.me { color:var(--accent); }
  .hud .hint { font-size:13px; color:var(--sub); margin-top:3px; line-height:1.4; }
  .hud .cnt { font-size:12px; color:var(--sub); text-align:right; }
  .hud .cnt b { display:block; font-size:22px; color:var(--text); }
  .x { width:40px; height:40px; padding:0; margin:0; border-radius:20px; font-size:18px; background:rgba(42,49,66,.9); flex:none; }
  .bottom { position:absolute; left:0; right:0; bottom:0; padding:10px 12px calc(env(safe-area-inset-bottom) + 14px); display:flex; gap:8px; }
  .bottom button { margin:0; padding:18px 8px; font-size:18px; }
  .bottom .arrow { flex:0 0 72px; }
  .order { display:flex; gap:6px; margin-top:6px; flex-wrap:wrap; }
  .order span { font-size:11px; padding:2px 8px; border-radius:99px; background:#2a3142; color:var(--sub); }
  .order span.on { background:var(--accent); color:#2a1a05; font-weight:700; }
  .toast { position:absolute; left:50%; top:42%; transform:translate(-50%,-50%); background:rgba(10,12,18,.9); padding:12px 18px; border-radius:12px; font-size:15px; white-space:nowrap; pointer-events:none; }
  .big { font-size:30px; font-weight:900; text-align:center; margin:4px 0 10px; }
</style>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui"><div class="screen"><div class="card"><h1>ジェンガ</h1><p class="lead">読み込み中…</p></div></div></div>
<script type="module">
import * as THREE from "three";
import RAPIER from "https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.12.0/rapier.es.js";

await RAPIER.init();

// ================= 数値 =================
// 長さの単位：ブロックの幅 = 1（本物のジェンガ 7.5×2.5×1.5cm を 3×1×0.6 に）
const BL = 3, SLOT = 1, BW = 0.97, BH = 0.6;   // ブロックの長さ / 置き場の間隔 / ブロックの幅（すき間をあける）/ 高さ
const LEVELS = 18, N = LEVELS * 3;
const GRAV = -25;                  // 重力（見ためが軽すぎないよう本物より強め）
const DT = 1 / 120;                // 物理の 1 ステップ
let HVAR = 0.03;                 // ブロックの高さのばらつき（±3%）。高いブロックが重さを受け、低いブロックはゆるくなる
let FRICTION = 0.5;
const PULL_K = 70, PULL_C = 14;    // 指で押す・引く力（ばね / ブレーキ）
let PULL_AMAX = 140;             // 指の力の上限（加速度）。重さがかかったブロックは動きにくい
const FALL_DROP = 0.75 * BH;       // ターン開始時からこれ以上下がったブロックがあれば「崩れた」
const SNAP_MS = 80;                // 動きを送る間隔
const PREFIX = "jenga-online-room-";
const MAX_PLAYERS = 4;

// ================= 3D 表示 =================
const canvas = document.getElementById("c");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x161a24);
scene.fog = new THREE.Fog(0x161a24, 30, 60);
const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 200);
scene.add(new THREE.HemisphereLight(0xdfe8ff, 0x3a2a1a, 0.9));
const sun = new THREE.DirectionalLight(0xfff2dd, 1.6);
sun.position.set(8, 20, 6);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, { left: -9, right: 9, top: 14, bottom: -4, near: 1, far: 50 });
scene.add(sun);
const table = new THREE.Mesh(new THREE.CylinderGeometry(9, 9, 0.4, 48), new THREE.MeshStandardMaterial({ color: 0x4a3322, roughness: 0.9 }));
table.position.y = -0.2; table.receiveShadow = true; scene.add(table);

function woodTexture() {
  const c = document.createElement("canvas"); c.width = 512; c.height = 128;
  const g = c.getContext("2d");
  g.fillStyle = "#dcb47c"; g.fillRect(0, 0, 512, 128);
  for (let i = 0; i < 70; i++) {
    g.strokeStyle = `rgba(${110 + Math.random() * 30},${70 + Math.random() * 20},35,${0.05 + Math.random() * 0.13})`;
    g.lineWidth = 0.6 + Math.random() * 2.2;
    g.beginPath(); let y = Math.random() * 128; g.moveTo(0, y);
    for (let x = 0; x <= 512; x += 32) { y += (Math.random() - 0.5) * 3; g.lineTo(x, y); }
    g.stroke();
  }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const WOOD = woodTexture();
const EDGE_MAT = new THREE.LineBasicMaterial({ color: 0x5a3c1e, transparent: true, opacity: 0.55 });

function resize() {
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
}
addEventListener("resize", resize); resize();

const cam = { yaw: 0.65, pitch: 0.28, dist: 18, ty: 5, goal: null };   // goal: 自動で視点の高さを合わせる先
function updateCamera() {
  if (cam.goal != null) { cam.ty += (cam.goal - cam.ty) * 0.08; if (Math.abs(cam.goal - cam.ty) < 0.02) cam.goal = null; }
  const cp = Math.cos(cam.pitch);
  camera.position.set(Math.sin(cam.yaw) * cp * cam.dist, cam.ty + Math.sin(cam.pitch) * cam.dist, Math.cos(cam.yaw) * cp * cam.dist);
  camera.lookAt(0, cam.ty, 0);
}

// ================= 物理 =================
let world = null, bodies = [], cols = [], meshes = [], heights = [];
const tgtPos = [], tgtQuat = [];       // 見ているだけのときに近づけていく先
const Q_Y90 = { x: 0, y: Math.SQRT1_2, z: 0, w: Math.SQRT1_2 }, Q_ID = { x: 0, y: 0, z: 0, w: 1 };
const ZERO = { x: 0, y: 0, z: 0 };

function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function buildTower(seed) {
  if (world) world.free();
  for (const m of meshes) { scene.remove(m); m.geometry.dispose(); m.material.dispose(); m.children[0]?.geometry.dispose(); }
  world = new RAPIER.World({ x: 0, y: GRAV, z: 0 });
  world.timestep = DT;
  world.integrationParameters.numSolverIterations = 8;
  world.createCollider(RAPIER.ColliderDesc.cuboid(30, 0.5, 30).setTranslation(0, -0.5, 0).setFriction(0.7));
  bodies = []; cols = []; meshes = []; heights = [];
  const rnd = mulberry32(seed);
  let base = 0;
  for (let lv = 0; lv < LEVELS; lv++) {
    let top = 0;
    for (let k = 0; k < 3; k++) {
      const h = BH * (1 + (rnd() * 2 - 1) * HVAR);
      top = Math.max(top, h);
      const odd = lv % 2 === 1, off = (k - 1) * SLOT;
      const b = world.createRigidBody(RAPIER.RigidBodyDesc.dynamic()
        .setTranslation(odd ? off : 0, base + h / 2, odd ? 0 : off).setRotation(odd ? Q_Y90 : Q_ID));
      const c = world.createCollider(RAPIER.ColliderDesc.cuboid(BL / 2, h / 2, BW / 2).setFriction(FRICTION).setRestitution(0).setDensity(1), b);
      bodies.push(b); cols.push(c); heights.push(h);
      const tint = 0.9 + rnd() * 0.12;
      const m = new THREE.Mesh(new THREE.BoxGeometry(BL, h, BW),
        new THREE.MeshStandardMaterial({ map: WOOD, roughness: 0.75, color: new THREE.Color(tint, tint * 0.98, tint * 0.95) }));
      m.castShadow = m.receiveShadow = true; m.userData.i = bodies.length - 1;
      m.add(new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry), EDGE_MAT));   // ふちの線（ブロックの境目を見やすく）
      scene.add(m); meshes.push(m);
      tgtPos.push(new THREE.Vector3()); tgtQuat.push(new THREE.Quaternion());
    }
    base += top;
  }
  tgtPos.length = tgtQuat.length = N;
  syncMeshesFromBodies(true);
}

function syncMeshesFromBodies(alsoTarget) {
  for (let i = 0; i < N; i++) {
    const p = bodies[i].translation(), q = bodies[i].rotation();
    meshes[i].position.set(p.x, p.y, p.z); meshes[i].quaternion.set(q.x, q.y, q.z, q.w);
    if (alsoTarget) { tgtPos[i].copy(meshes[i].position); tgtQuat[i].copy(meshes[i].quaternion); }
  }
}
function lerpMeshes() {
  for (let i = 0; i < N; i++) { meshes[i].position.lerp(tgtPos[i], 0.3); meshes[i].quaternion.slerp(tgtQuat[i], 0.3); }
}
const r4 = v => Math.round(v * 10000) / 10000;
function snapshot() {
  const d = new Array(N * 7);
  for (let i = 0; i < N; i++) {
    const p = bodies[i].translation(), q = bodies[i].rotation(), o = i * 7;
    d[o] = r4(p.x); d[o + 1] = r4(p.y); d[o + 2] = r4(p.z); d[o + 3] = r4(q.x); d[o + 4] = r4(q.y); d[o + 5] = r4(q.z); d[o + 6] = r4(q.w);
  }
  return d;
}
function setTargets(d) {
  for (let i = 0; i < N; i++) { const o = i * 7; tgtPos[i].set(d[o], d[o + 1], d[o + 2]); tgtQuat[i].set(d[o + 3], d[o + 4], d[o + 5], d[o + 6]); }
}
function applySnapshot(d) {
  for (let i = 0; i < N; i++) {
    const b = bodies[i], o = i * 7;
    resetBody(i);
    b.setTranslation({ x: d[o], y: d[o + 1], z: d[o + 2] }, true);
    b.setRotation({ x: d[o + 3], y: d[o + 4], z: d[o + 5], w: d[o + 6] }, true);
    b.setLinvel(ZERO, true); b.setAngvel(ZERO, true);
  }
  syncMeshesFromBodies(true);
}
function resetBody(i) {
  const b = bodies[i];
  if (b.bodyType() !== RAPIER.RigidBodyType.Dynamic) b.setBodyType(RAPIER.RigidBodyType.Dynamic, true);
  cols[i].setSensor(false);
  b.setGravityScale(1, true); b.setLinearDamping(0); b.setAngularDamping(0);
}

const levelOf = i => Math.round((bodies[i].translation().y - BH / 2) / BH);
const axisOf = i => { const q = bodies[i].rotation(); return new THREE.Vector3(1, 0, 0).applyQuaternion(new THREE.Quaternion(q.x, q.y, q.z, q.w)).setY(0).normalize(); };

function towerInfo(excl) {
  const by = new Map(); let top = 0;
  for (let i = 0; i < N; i++) {
    if (i === excl) continue;
    const l = levelOf(i); if (!by.has(l)) by.set(l, []); by.get(l).push(i); top = Math.max(top, l);
  }
  return { by, top };
}
function canPick(i) {
  const { by, top } = towerInfo(-1), l = levelOf(i);
  return by.get(top).length < 3 ? l < top - 1 : l < top;   // 一番上の段（作りかけならその下の段も）は抜けない
}
// 抜いたブロックを置ける場所
function placeInfo(excl) {
  const { by, top } = towerInfo(excl);
  let lt = top, occ = new Set();
  if ((by.get(top) || []).length >= 3) lt = top + 1;
  const below = by.get(lt - 1) || [];
  let cx = 0, cz = 0;
  for (const i of below) { const p = bodies[i].translation(); cx += p.x; cz += p.z; }
  if (below.length) { cx /= below.length; cz /= below.length; }
  const odd = lt % 2 === 1;
  for (const i of by.get(lt) || []) {
    if (lt === top + 1) break;
    const p = bodies[i].translation();
    occ.add(Math.max(0, Math.min(2, Math.round((odd ? p.x - cx : p.z - cz) / SLOT) + 1)));
  }
  const free = [0, 1, 2].filter(k => !occ.has(k));
  return { lt, odd, cx, cz, free };
}
function slotPose(info, k) {
  const off = (k - 1) * SLOT;
  const x = info.cx + (info.odd ? off : 0), z = info.cz + (info.odd ? 0 : off);
  // 真上から光線を落として、置く面の高さを調べる（ブロックの両端と真ん中）
  let surf = 0;
  const ax = info.odd ? { x: 0, z: 1 } : { x: 1, z: 0 };
  for (const t of [-0.4, 0, 0.4]) {
    const ray = new RAPIER.Ray({ x: x + ax.x * BL * t, y: 60, z: z + ax.z * BL * t }, { x: 0, y: -1, z: 0 });
    const hit = world.castRay(ray, 120, true, undefined, undefined, cols[held], bodies[held]);
    if (hit) surf = Math.max(surf, 60 - hit.toi);
  }
  return { x, z, surf, q: info.odd ? Q_Y90 : Q_ID };
}

// ================= ゲームの状態 =================
let mode = null;          // "local" / "host" / "client"
let screen = "loading";   // loading / menu / connecting / lobby / game
let myId = 0, curId = 0, moves = 0, players = [], order = [];
let phase = "idle";       // pull / place / settle / fallen / wait / watch / over
let sel = -1, held = -1, viewSel = -1, phaseT = 0, quietT = 0;
let drag = null;          // { axis, off0, target, dir:{x,y}, ppu, sx, sy }
let place = null;         // { info, k, pose }
let turnPos = [], baseY = [];
let overInfo = null, errMsg = "", toastMsg = "", toastT = 0, lastSend = 0;
let peer = null, hostConn = null, lobby = [];

const isMine = () => mode === "local" || curId === myId;
const nameOf = id => (players.find(p => p.id === id) || { name: "?" }).name;

function beginMyTurn() {
  phase = "pull"; sel = -1; held = -1; place = null; drag = null; phaseT = 0;
  turnPos = []; baseY = [];
  for (let i = 0; i < N; i++) setHighlight(i, false);
  for (let i = 0; i < N; i++) { const p = bodies[i].translation(); turnPos.push(new THREE.Vector3(p.x, p.y, p.z)); baseY.push(p.y); }
}
function setHighlight(i, on) {
  if (i < 0 || !meshes[i]) return;
  meshes[i].material.emissive.setHex(on ? 0x2a55ff : 0x000000);
  meshes[i].material.emissiveIntensity = on ? 0.55 : 0;
}
function selectBlock(i) {
  if (sel === i) return;
  releaseSel();
  sel = i; setHighlight(i, true);
  const b = bodies[i];
  b.setGravityScale(0, true);      // 指でつまんでいるので、引き出しても落ちない
  b.setLinearDamping(4); b.setAngularDamping(8);
}
function releaseSel() {
  if (sel < 0) return;
  setHighlight(sel, false);
  const b = bodies[sel]; b.setGravityScale(1, true); b.setLinearDamping(0); b.setAngularDamping(0); b.wakeUp();
  sel = -1; drag = null;
}

function physStep() {
  if (phase === "pull" && sel >= 0 && drag) {
    const b = bodies[sel], p = b.translation(), v = b.linvel(), o = turnPos[sel];
    const off = (p.x - o.x) * drag.axis.x + (p.z - o.z) * drag.axis.z;
    const va = v.x * drag.axis.x + v.z * drag.axis.z;
    const a = Math.max(-PULL_AMAX, Math.min(PULL_AMAX, PULL_K * (drag.target - off) - PULL_C * va));
    const m = b.mass() * a * DT;
    b.applyImpulse({ x: drag.axis.x * m, y: 0, z: drag.axis.z * m }, true);
  }
  if (phase === "place" && held >= 0) {
    const b = bodies[held], p = b.translation(), q = b.rotation(), t = place.pose;
    const k = Math.min(1, 10 * DT);
    const ty = t.surf + BH * 2.2 + heights[held] / 2;
    b.setNextKinematicTranslation({ x: p.x + (t.x - p.x) * k, y: p.y + (ty - p.y) * k, z: p.z + (t.z - p.z) * k });
    const cq = new THREE.Quaternion(q.x, q.y, q.z, q.w).slerp(new THREE.Quaternion(t.q.x, t.q.y, t.q.z, t.q.w), k);
    b.setNextKinematicRotation({ x: cq.x, y: cq.y, z: cq.z, w: cq.w });
  }
  world.step();
  phaseT += DT;

  if (phase === "pull" && sel >= 0) {
    const p = bodies[sel].translation(), o = turnPos[sel], ax = axisOf(sel);
    if (Math.abs((p.x - o.x) * ax.x + (p.z - o.z) * ax.z) > BL * 0.97) extract();
  }
  if (phase === "settle") {
    let mv = 0;
    for (const b of bodies) { const v = b.linvel(), w = b.angvel(); mv = Math.max(mv, Math.hypot(v.x, v.y, v.z), Math.hypot(w.x, w.y, w.z) * 0.5); }
    quietT = mv < 0.08 ? quietT + DT : 0;
    if ((phaseT > 0.8 && quietT > 0.6) || phaseT > 8) {
      if (!checkFallen()) { phase = "wait"; send({ t: "end", d: snapshot() }); renderUI(); return; }
    }
  }
  if ((phase === "pull" || phase === "place" || phase === "settle") && checkFallen()) {
    phase = "fallen"; phaseT = 0; releaseSel(); navigator.vibrate?.([80, 40, 160]); renderUI();
  }
  if (phase === "fallen" && phaseT > 2.5) { phase = "wait"; send({ t: "fall", d: snapshot() }); return; }
  const now = performance.now();   // 見ている人へ今の位置を送る
  if (mode !== "local" && now - lastSend > SNAP_MS && ["pull", "place", "settle", "fallen"].includes(phase)) {
    lastSend = now; send({ t: "snap", d: snapshot(), s: sel >= 0 ? sel : held });
  }
}
function checkFallen() {
  for (let i = 0; i < N; i++) {
    if (i === sel || (i === held && phase === "place")) continue;
    if (bodies[i].translation().y < baseY[i] - FALL_DROP) return true;
  }
  return false;
}
function extract() {
  held = sel; setHighlight(sel, false); sel = -1; drag = null;
  const b = bodies[held];
  b.setGravityScale(1, true); b.setLinearDamping(0); b.setAngularDamping(0);
  b.setBodyType(RAPIER.RigidBodyType.KinematicPositionBased, true);
  cols[held].setSensor(true);      // 運んでいる間はほかのブロックにぶつからない
  const info = placeInfo(held);
  const k = info.free.includes(1) ? 1 : info.free[0];
  place = { info, k, pose: slotPose(info, k) };
  cam.goal = Math.min(LEVELS * BH + 8, place.pose.surf - 1);   // 上の置き場が見えるように
  phase = "place"; phaseT = 0; navigator.vibrate?.(30);
  renderUI();
}
function moveSlot(dir) {
  if (phase !== "place") return;
  const f = place.info.free, idx = f.indexOf(place.k);
  place.k = f[(idx + dir + f.length) % f.length];
  place.pose = slotPose(place.info, place.k);
}
function dropHeld() {
  if (phase !== "place") return;
  const b = bodies[held], t = place.pose, y = t.surf + heights[held] / 2 + 0.004;
  b.setBodyType(RAPIER.RigidBodyType.Dynamic, true);
  cols[held].setSensor(false);
  b.setTranslation({ x: t.x, y, z: t.z }, true); b.setRotation(t.q, true);
  b.setLinvel(ZERO, true); b.setAngvel(ZERO, true);
  baseY[held] = y;
  phase = "settle"; phaseT = 0; quietT = 0; place = null;
  renderUI();
}

// ================= 操作（タッチ）=================
const ptrs = new Map(); let gesture = null;
const raycaster = new THREE.Raycaster();
function pick(x, y) {
  updateCamera(); scene.updateMatrixWorld(); camera.updateMatrixWorld();
  raycaster.setFromCamera(new THREE.Vector2(x / innerWidth * 2 - 1, -(y / innerHeight) * 2 + 1), camera);
  const hit = raycaster.intersectObjects(meshes, false)[0];
  return hit ? hit.object.userData.i : -1;
}
function toScreen(v) { const p = v.clone().project(camera); return { x: (p.x + 1) / 2 * innerWidth, y: (1 - p.y) / 2 * innerHeight }; }
function startDrag(x, y) {
  const b = bodies[sel], p = b.translation(), o = turnPos[sel], axis = axisOf(sel);
  const c = new THREE.Vector3(p.x, p.y, p.z);
  const s0 = toScreen(c), s1 = toScreen(c.clone().add(axis));
  let dx = s1.x - s0.x, dy = s1.y - s0.y, ppu = Math.hypot(dx, dy);
  if (ppu < 22) {   // ブロックがこちらを向いているときは、上へなぞる = 奥へ押す
    const fwd = new THREE.Vector3(); camera.getWorldDirection(fwd); fwd.setY(0).normalize();
    const s = Math.sign(fwd.dot(axis)) || 1; dx = 0; dy = -s; ppu = 40;
  } else { dx /= ppu; dy /= ppu; }
  ppu = Math.max(ppu, 30);
  const off0 = (p.x - o.x) * axis.x + (p.z - o.z) * axis.z;
  drag = { axis, off0, target: off0, dir: { x: dx, y: dy }, ppu, sx: x, sy: y };
}
canvas.addEventListener("pointerdown", e => {
  try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (ptrs.size === 1) {
    const hit = pick(e.clientX, e.clientY);
    if (screen === "game" && isMine() && phase === "pull" && sel >= 0 && hit === sel) { startDrag(e.clientX, e.clientY); gesture = { type: "push" }; }
    else gesture = { type: "orbit", hit, moved: 0, lx: e.clientX, ly: e.clientY };
    cam.goal = null;
  } else if (ptrs.size === 2) {
    drag = null;
    const [a, b] = [...ptrs.values()];
    gesture = { type: "pinch", d0: Math.hypot(a.x - b.x, a.y - b.y), dist0: cam.dist, ty0: cam.ty, my0: (a.y + b.y) / 2 };
  }
});
canvas.addEventListener("pointermove", e => {
  if (!ptrs.has(e.pointerId)) return;
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (!gesture) return;
  if (gesture.type === "orbit") {
    const dx = e.clientX - gesture.lx, dy = e.clientY - gesture.ly;
    gesture.lx = e.clientX; gesture.ly = e.clientY; gesture.moved += Math.abs(dx) + Math.abs(dy);
    cam.yaw -= dx * 0.009;
    cam.ty = Math.max(0.5, Math.min(LEVELS * BH + 8, cam.ty + dy * 0.025));
  } else if (gesture.type === "push" && drag) {
    const s = ((e.clientX - drag.sx) * drag.dir.x + (e.clientY - drag.sy) * drag.dir.y) / drag.ppu;
    drag.target = Math.max(-BL - 0.5, Math.min(BL + 0.5, drag.off0 + s));
  } else if (gesture.type === "pinch" && ptrs.size >= 2) {
    const [a, b] = [...ptrs.values()];
    cam.dist = Math.max(7, Math.min(32, gesture.dist0 * gesture.d0 / Math.max(10, Math.hypot(a.x - b.x, a.y - b.y))));
    cam.ty = Math.max(0.5, Math.min(LEVELS * BH + 8, gesture.ty0 + ((a.y + b.y) / 2 - gesture.my0) * 0.025));
  }
});
function pointerEnd(e) {
  if (!ptrs.has(e.pointerId)) return;
  ptrs.delete(e.pointerId);
  if (gesture?.type === "orbit" && gesture.moved < 10 && gesture.hit >= 0 && ptrs.size === 0) tapBlock(gesture.hit);
  if (gesture?.type === "push") drag = null;
  if (ptrs.size === 1) { const p = [...ptrs.values()][0]; gesture = { type: "orbit", hit: -1, moved: 99, lx: p.x, ly: p.y }; }
  else if (ptrs.size === 0) gesture = null;
}
canvas.addEventListener("pointerup", pointerEnd);
canvas.addEventListener("pointercancel", pointerEnd);
function tapBlock(i) {
  if (screen !== "game" || !isMine() || phase !== "pull") return;
  if (!canPick(i)) { toast("上の段からは抜けません"); return; }
  selectBlock(i); renderUI();
}
function toast(t) { toastMsg = t; toastT = performance.now() + 1500; renderUI(); setTimeout(renderUI, 1600); }

// ================= 通信 =================
// ホストがまとめ役。参加者 → ホスト → みんな。動かしている人だけが物理を計算し、ほかの人は送られてきた位置を表示する
const host = { conns: new Map(), nextId: 1, playing: false, turnI: 0, n: 0, last: null };

function send(m) {
  if (mode === "client") { try { hostConn.send(m); } catch (e) {} }
  else hostHandle(mode === "local" ? curId : 0, m);
}
function bcast(m, except) {
  for (const [id, c] of host.conns) if (id !== except && c.open) { try { c.send(m); } catch (e) {} }
  if (except !== 0) onMsg(m);
}
function hostLobby() { lobby = [{ id: 0, name: myName() }, ...[...host.conns.keys()].map(id => ({ id, name: host.conns.get(id).pname }))]; bcast({ t: "lobby", players: lobby }); }
function hostStart() {
  host.playing = true; host.turnI = 0; host.n = 0; host.last = null;
  const ps = mode === "local" ? players : lobby.slice();
  const ord = ps.map(p => p.id);
  for (let i = ord.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [ord[i], ord[j]] = [ord[j], ord[i]]; }
  if (mode === "local") ord.sort((a, b) => a - b);
  bcast({ t: "start", seed: (Math.random() * 2 ** 31) | 0, players: ps, order: ord });
  bcast({ t: "turn", cur: ord[0], d: null, n: 0 });
}
function hostHandle(from, m) {
  if (m.t === "hello") return;
  if (!host.playing) return;
  const cur = order[host.turnI % order.length];
  if (from !== cur) return;
  if (m.t === "snap") { host.last = m.d; bcast(m, from); }
  else if (m.t === "end") {
    host.last = m.d; host.n++; host.turnI = (host.turnI + 1) % order.length;
    bcast({ t: "turn", cur: order[host.turnI], d: m.d, n: host.n });
  } else if (m.t === "fall") {
    host.playing = false;
    bcast({ t: "over", loser: from, d: m.d, n: host.n });
  }
}
function hostDrop(id) {
  host.conns.delete(id);
  if (!host.playing) { hostLobby(); return; }
  const wasCur = order[host.turnI] === id;
  const idx = order.indexOf(id);
  const nextOrder = order.filter(x => x !== id);
  if (idx >= 0 && idx < host.turnI) host.turnI--;
  bcast({ t: "order", order: nextOrder, left: id });
  if (nextOrder.length < 2) { host.playing = false; bcast({ t: "over", loser: -1, left: id, d: host.last, n: host.n }); return; }
  host.turnI %= nextOrder.length;
  if (wasCur) bcast({ t: "turn", cur: nextOrder[host.turnI], d: host.last, n: host.n });
}

function onMsg(m) {
  switch (m.t) {
    case "welcome": myId = m.you; screen = "lobby"; break;
    case "reject": errMsg = m.why; screen = "menu"; cleanupNet(); break;
    case "lobby": lobby = m.players; break;
    case "start":
      players = m.players; order = m.order; overInfo = null;
      buildTower(m.seed); screen = "game"; phase = "watch"; viewSel = -1;
      Object.assign(cam, { yaw: 0.65, dist: 18, ty: 5 });
      break;
    case "order": order = m.order; break;
    case "turn":
      if (viewSel >= 0) setHighlight(viewSel, false); viewSel = -1;
      curId = m.cur; moves = m.n;
      if (m.d) applySnapshot(m.d);
      if (isMine()) beginMyTurn(); else phase = "watch";
      break;
    case "snap":
      if (isMine() || screen !== "game") return;
      setTargets(m.d);
      if (m.s !== viewSel) { setHighlight(viewSel, false); viewSel = m.s; setHighlight(viewSel, true); }
      return;
    case "over":
      setHighlight(viewSel, false); viewSel = -1;
      phase = "over"; overInfo = m; moves = m.n;
      if (m.d && !isMine()) setTargets(m.d);
      break;
  }
  renderUI();
}

function cleanupNet() { try { peer?.destroy(); } catch (e) {} peer = null; hostConn = null; host.conns.clear(); host.playing = false; }
const randCode = () => String(Math.floor(1000 + Math.random() * 9000));
let hostTries = 0;
function startHost() {
  mode = "host"; screen = "connecting"; errMsg = ""; myId = 0; renderUI();
  const code = randCode();
  peer = new Peer(PREFIX + code);
  peer.on("open", () => { host.code = code; screen = "lobby"; hostLobby(); renderUI(); });
  peer.on("error", e => {
    if (e.type === "unavailable-id" && ++hostTries < 20) { peer.destroy(); startHost(); return; }
    if (screen === "game") { toast("通信エラー: " + e.type); return; }
    errMsg = "接続エラー: " + e.type; screen = "menu"; cleanupNet(); renderUI();
  });
  peer.on("connection", conn => {
    conn.on("data", m => {
      if (m && m.t === "hello") {
        if (host.playing) { conn.send({ t: "reject", why: "もう始まっています" }); setTimeout(() => conn.close(), 500); return; }
        if (host.conns.size + 1 >= MAX_PLAYERS) { conn.send({ t: "reject", why: "満員です（4人まで）" }); setTimeout(() => conn.close(), 500); return; }
        const id = host.nextId++; conn.pid = id; conn.pname = String(m.name || "ゲスト").slice(0, 12);
        host.conns.set(id, conn); conn.send({ t: "welcome", you: id }); hostLobby(); renderUI(); return;
      }
      if (conn.pid) hostHandle(conn.pid, m);
    });
    conn.on("close", () => { if (conn.pid && host.conns.get(conn.pid) === conn) { hostDrop(conn.pid); renderUI(); } });
  });
}
function joinRoom(code) {
  code = String(code).replace(/\D/g, "");
  if (code.length !== 4) { errMsg = "部屋番号は4けたです"; renderUI(); return; }
  mode = "client"; screen = "connecting"; errMsg = ""; host.code = code; renderUI();
  peer = new Peer();
  peer.on("open", () => {
    hostConn = peer.connect(PREFIX + code, { reliable: true });
    hostConn.on("open", () => hostConn.send({ t: "hello", name: myName() }));
    hostConn.on("data", onMsg);
    hostConn.on("close", () => { if (screen !== "menu") { errMsg = "ホストとの接続が切れました"; screen = "menu"; cleanupNet(); renderUI(); } });
  });
  peer.on("error", e => {
    errMsg = e.type === "peer-unavailable" ? "部屋が見つかりません（番号ちがい、またはホストが閉じました）" : "接続エラー: " + e.type;
    screen = "menu"; cleanupNet(); renderUI();
  });
}
function startLocal(n) {
  mode = "local"; myId = 0;
  players = Array.from({ length: n }, (_, i) => ({ id: i, name: n === 1 ? myName() : `プレイヤー${i + 1}` }));
  hostStart();
}

// ================= 画面 =================
const ui = document.getElementById("ui");
const esc = t => String(t).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
let meName = "";
function myName() { if (meName) return meName; return (document.getElementById("name")?.value || store.get("jenga-name") || "ゲスト").trim().slice(0, 12) || "ゲスト"; }
function fixName() { meName = ""; meName = myName(); store.set("jenga-name", meName); }
const urlRoom = new URLSearchParams(location.search).get("room") || "";
function shareUrl() { const u = new URL(location.href); u.search = "?room=" + host.code + "&openExternalBrowser=1"; u.hash = ""; return u.toString(); }

function renderUI() {
  let h = "";
  if (screen === "menu") {
    h = `<div class="screen"><div class="card">
      <h1>ジェンガ</h1><p class="lead">崩したら負け。2〜4人でオンライン対戦</p>
      <label>なまえ</label><input id="name" maxlength="12" value="${esc(store.get("jenga-name") || "")}" placeholder="ゲスト">
      <button class="main" data-a="host">部屋を作る</button>
      <label>部屋番号で入る</label>
      <div class="row"><input id="code" inputmode="numeric" maxlength="4" placeholder="1234" value="${esc(urlRoom)}"><button class="blue" data-a="join" style="margin-top:0">入る</button></div>
      <div class="sep"></div>
      <button data-a="solo">ひとりで練習</button>
      <div class="row"><button data-a="local2">2人で交代</button><button data-a="local3">3人</button><button data-a="local4">4人</button></div>
      ${errMsg ? `<div class="err">${esc(errMsg)}</div>` : ""}
    </div></div>`;
  } else if (screen === "loading" || screen === "connecting") {
    h = `<div class="screen"><div class="card"><h1>ジェンガ</h1><p class="lead">${screen === "loading" ? "読み込み中…" : "つないでいます…"}</p>
      <button data-a="back">やめる</button></div></div>`;
  } else if (screen === "lobby") {
    h = `<div class="screen"><div class="card">
      <p class="lead" style="margin:0">部屋番号</p><div class="code">${esc(host.code || "")}</div>
      <button class="blue" data-a="share">招待リンクを送る</button>
      <ul class="players">${lobby.map(p => `<li><span>${esc(p.name)}${p.id === myId ? "（あなた）" : ""}</span><span style="color:var(--sub)">${p.id === 0 ? "ホスト" : ""}</span></li>`).join("")}</ul>
      ${mode === "host" ? `<button class="main" data-a="start" ${lobby.length < 2 ? "disabled" : ""}>${lobby.length < 2 ? "参加者を待っています…" : `${lobby.length}人で始める`}</button>`
        : `<p class="lead" style="margin-top:12px">ホストが始めるのを待っています…</p>`}
      <button data-a="back">ぬける</button>
    </div></div>`;
  } else if (screen === "game") {
    const mine = isMine() && phase !== "over";
    const hints = {
      pull: sel < 0 ? "抜くブロックをタップ。背景をなぞると視点が回ります" : "青いブロックを指でなぞって押す・引く。ほかをタップで選び直し",
      place: "置く場所を ◀ ▶ で選んで「置く」",
      settle: "揺れがおさまるのを待っています…",
      fallen: "崩れた！",
      wait: "…",
      watch: `${esc(nameOf(curId))}が挑戦中`,
    };
    const turnTxt = phase === "over" ? "おわり" : mode === "local" && players.length === 1 ? "練習中" : mine ? (mode === "local" ? `${esc(nameOf(curId))}の番` : "あなたの番") : `${esc(nameOf(curId))}の番`;
    h = `<div class="hud p"><div class="who"><div class="turn ${mine ? "me" : ""}">${turnTxt}</div>
        <div class="hint">${hints[phase] || ""}</div>
        ${order.length > 1 ? `<div class="order">${order.map(id => `<span class="${id === curId && phase !== "over" ? "on" : ""}">${esc(nameOf(id))}</span>`).join("")}</div>` : ""}</div>
      <div class="cnt">ターン<b>${moves}</b></div><button class="x" data-a="quit">✕</button></div>`;
    if (mine && phase === "place") {
      const one = place && place.info.free.length < 2;
      h += `<div class="bottom p"><button class="arrow" data-a="left" ${one ? "disabled" : ""}>◀</button><button class="main" data-a="drop">置く</button><button class="arrow" data-a="right" ${one ? "disabled" : ""}>▶</button></div>`;
    }
    if (phase === "over" && overInfo) {
      const o = overInfo;
      let title, sub;
      if (o.loser === -1) { title = "相手がいなくなりました"; sub = `${o.n}ターン`; }
      else if (mode === "local" && players.length === 1) { title = "崩れた！"; sub = `記録：${o.n}本 積みました`; }
      else { title = o.loser === myId && mode !== "local" ? "あなたの負け…" : `${esc(nameOf(o.loser))}の負け`; sub = `${esc(nameOf(o.loser))}が崩しました（${o.n + 1}ターン目）`; }
      const canRestart = mode === "local" || (mode === "host" && lobby.length >= 2);
      h += `<div class="screen" style="background:rgba(16,19,27,.55)"><div class="card"><div class="big">${title}</div><p class="lead">${sub}</p>
        ${canRestart ? `<button class="main" data-a="again">もう一回</button>` : mode === "client" ? `<p class="lead">ホストがもう一回を押すのを待っています…</p>` : ""}
        <button data-a="back">メニューへ</button></div></div>`;
    }
  }
  if (toastMsg && performance.now() < toastT) h += `<div class="toast">${esc(toastMsg)}</div>`;
  ui.innerHTML = h;
  const nm = document.getElementById("name"); if (nm) nm.oninput = () => store.set("jenga-name", nm.value);
}
ui.addEventListener("click", e => {
  const a = e.target.closest("[data-a]")?.dataset.a; if (!a) return;
  if (a === "host") { fixName(); startHost(); }
  else if (a === "join") { fixName(); joinRoom(document.getElementById("code").value); }
  else if (a === "solo") { fixName(); startLocal(1); }
  else if (a.startsWith("local")) startLocal(+a.slice(5));
  else if (a === "start") hostStart();
  else if (a === "again") { if (mode === "local") hostStart(); else if (mode === "host") hostStart(); }
  else if (a === "share") {
    const url = shareUrl();
    if (navigator.share) navigator.share({ title: "ジェンガやろう", text: `部屋番号 ${host.code}`, url }).catch(() => {});
    else navigator.clipboard?.writeText(url).then(() => toast("リンクをコピーしました"), () => toast(url));
  }
  else if (a === "left") moveSlot(-1);
  else if (a === "right") moveSlot(1);
  else if (a === "drop") dropHeld();
  else if (a === "quit") { if (confirm("ゲームをやめてメニューに戻りますか？")) backToMenu(); }
  else if (a === "back") backToMenu();
});
function backToMenu() { cleanupNet(); mode = null; screen = "menu"; phase = "idle"; errMsg = ""; renderUI(); }

// ================= ループ =================
let acc = 0, last = performance.now();
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  const sim = screen === "game" && isMine() && ["pull", "place", "settle", "fallen"].includes(phase);
  if (sim) {
    acc += dt; let k = 0;
    while (acc >= DT && k < 8) { physStep(); acc -= DT; k++; }
    if (k === 8) acc = 0;
    syncMeshesFromBodies(true);
  } else if (screen === "game") { acc = 0; if (!isMine() || phase === "over") lerpMeshes(); }
  updateCamera();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
buildTower(1);
screen = "menu"; renderUI();
requestAnimationFrame(frame);
// 動作確認用（コンソールから __jenga.tap(10) / __jenga.pull(3.2) など）
window.__jenga = {
  get phase() { return phase; }, get sel() { return sel; }, get drag() { return drag; }, get gesture() { return gesture; }, pick,
  shown: i => [...tgtPos[i].toArray(), viewSel], get moves() { return moves; }, bodies: () => bodies, canPick,
  snap: snapshot, load: d => { applySnapshot(d); beginMyTurn(); }, build: s => { buildTower(s); beginMyTurn(); },
  set: o => { if (o.HVAR != null) HVAR = o.HVAR; if (o.AMAX != null) PULL_AMAX = o.AMAX; if (o.FRICTION != null) FRICTION = o.FRICTION; },
  tap: tapBlock, drop: dropHeld, moveSlot, step: n => { for (let i = 0; i < n && ["pull", "place", "settle", "fallen"].includes(phase); i++) physStep(); syncMeshesFromBodies(true); },
  pull: t => { if (sel >= 0) drag = { axis: axisOf(sel), off0: 0, target: t, dir: { x: 1, y: 0 }, ppu: 50, sx: 0, sy: 0 }; },
};
</script>
